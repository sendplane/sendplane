name: ci

on:
  push:
    branches: [main]
    # A v* tag runs the same checks and, once they pass, publishes the image
    # (the `docker` job below).
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mongo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendplane
          POSTGRES_PASSWORD: sendplane
          POSTGRES_DB: sendplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendplane -d sendplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENDPLANE_TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://sendplane:sendplane@localhost:5432/sendplane?sslmode=disable' || '' }}
      SENDPLANE_TEST_MONGO_URI: ${{ matrix.db == 'mongo' && 'mongodb://localhost:27017' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      # The client types are generated from api/openapi.yaml and committed, so a
      # spec change that nobody regenerated has to fail here rather than drift
      # silently (ADR-0010).
      - name: openapi client drift
        run: |
          pnpm gen
          git diff --exit-code packages/api/src/schema.d.ts

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      # VITE_BASE matches the default console.path the binary mounts the
      # console at (same as deploy/dev/Dockerfile's web-build stage), so this
      # build is the one the release image ships.
      - name: build
        env:
          VITE_BASE: /console/
        run: pnpm build

      # Proves the embed actually compiles: copies the just-built console
      # into cmd/sendplane/console/dist (what `make console-sync` does) and
      # builds the Go binaries that embed it (ADR-0010). They are built for
      # every release platform, laid out as <os>/<arch>/ so
      # deploy/release/Dockerfile can COPY ${TARGETPLATFORM}/, and on a v* tag
      # handed to the `docker` job instead of being rebuilt there.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: console embed build
        working-directory: .
        env:
          CGO_ENABLED: "0"
        run: |
          rm -rf cmd/sendplane/console/dist
          mkdir -p cmd/sendplane/console/dist
          cp -R web/apps/console/dist/. cmd/sendplane/console/dist/
          for arch in amd64 arm64; do
            out="dist/docker/linux/$arch"
            mkdir -p "$out"
            for cmd in sendplane chaos-smtp; do
              GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" \
                -o "$out/$cmd" "./cmd/$cmd"
            done
          done

      - name: upload release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/docker
          if-no-files-found: error
          retention-days: 1

  # Publishes ghcr.io/<owner>/<repo> for linux/amd64 and linux/arm64 on a v*
  # tag. The binaries come from the `web` job's artifact, not from a build in
  # the image: deploy/release/Dockerfile only copies them in, so the
  # multi-arch build needs no QEMU.
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Artifacts drop the executable bit; the Dockerfile restores it with
      # COPY --chmod.
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist/docker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> 1.2.3, 1.2, latest (the Helm chart defaults image.tag to
      # appVersion, which has no "v"). Pre-releases (v1.2.3-rc.1) get only
      # their exact version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: deploy/release/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
