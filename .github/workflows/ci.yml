name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mongo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sendplane
          POSTGRES_PASSWORD: sendplane
          POSTGRES_DB: sendplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendplane -d sendplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SENDPLANE_TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://sendplane:sendplane@localhost:5432/sendplane?sslmode=disable' || '' }}
      SENDPLANE_TEST_MONGO_URI: ${{ matrix.db == 'mongo' && 'mongodb://localhost:27017' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      # The client types are generated from api/openapi.yaml and committed, so a
      # spec change that nobody regenerated has to fail here rather than drift
      # silently (ADR-0010).
      - name: openapi client drift
        run: |
          pnpm gen
          git diff --exit-code packages/api/src/schema.d.ts

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

      # Proves the embed actually compiles: copies the just-built console
      # into cmd/sendplane/console/dist (what `make console-sync` does) and
      # builds the Go binary that embeds it (ADR-0010).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: console embed build
        working-directory: .
        run: |
          rm -rf cmd/sendplane/console/dist
          mkdir -p cmd/sendplane/console/dist
          cp -R web/apps/console/dist/. cmd/sendplane/console/dist/
          go build ./cmd/sendplane
