# Configuration shared by the control, sender and bounce containers of the
# end-to-end test (docs/architecture.md 15). All three roles read the same
# file; --roles decides what actually runs. ${VAR} is expanded from the process
# environment by cmd/sendplane before the YAML is parsed, which is how the DSN,
# the AES-GCM key, the probe HMAC key and the webhook URL come in from
# docker-compose.yml.
#
# This file is for a throwaway test stack only: auth is disabled, the webhook
# SSRF guard is switched off and every interval is far below its production
# default so one run fits in ten minutes.

store:
  # postgres by default; test/e2e/docker-compose.mongo.yml overlays "mongo"
  # for the nightly run (docs/architecture.md 15: "mongo는 nightly").
  driver: ${SENDPLANE_STORE_DRIVER}
  dsn: ${SENDPLANE_STORE_DSN}
  mongo_db: sendplane

secrets:
  # Fixed, public, test-only key. The stack is torn down after every run.
  key: ${SENDPLANE_SECRETS_KEY}

auth:
  # The harness talks to control without credentials; every request is tenant
  # "default", roles [admin]. Never outside a test stack.
  mode: none
  # Scenario 9 needs the operator's own view (`_system`), which is the only
  # scope the platform overlay makes the shared transport, domain and probe
  # state visible in (ADR-0017). With auth.mode: none the one fixed local
  # principal may switch; roles are listed anyway so the config matches what a
  # real deployment would write.
  tenant_header:
    enabled: true
    header: X-Sendplane-Tenant
    roles: [admin]

authz:
  mode: allow_all

events:
  webhook:
    # The harness's own receiver, reached through host.docker.internal.
    url: ${SENDPLANE_WEBHOOK_URL}
    secret: ${SENDPLANE_WEBHOOK_SECRET}
    timeout: 10s
    # The receiver is on the host gateway, i.e. an RFC 1918 address. The guard
    # that normally refuses that (cmd/sendplane/events.go) has to be off here;
    # scenario 7 is exactly the test that the sink reaches the host at all.
    allow_private_networks: true

sender:
  lanes:
    transactional: 8
    bulk: 32
    # The loopback probe goes through the normal sender path, so this lane
    # needs at least one worker or every probe delivery sits queued and every
    # run times out (docs/architecture.md 11.2, internal/probe/README.md).
    probe: 1
  claim_batch: 200
  # Well below the 5m default: the optional --kill-sender step waits for the
  # control lease reaper (30s tick) to hand the dead replica's rows back, and a
  # 5m lease would put that recovery outside the run budget.
  lease_for: 60s
  ehlo_name: e2e.sendplane.test

bounce:
  # A DSN injected by the harness has to show up in seconds, not in the
  # production minute. IDLE is off so the timing is the poll interval and
  # nothing else.
  poll_interval: 5s
  refresh_interval: 10s
  use_idle: false

probe:
  enabled: true
  hmac_key: ${SENDPLANE_PROBE_HMAC_KEY}
  # Empty uses the container's resolver, which answers NXDOMAIN for the
  # .test domains this stack uses. The DNS layer is diagnostic only and never
  # turns a loopback verdict red (ADR-0012), so that is the correct outcome
  # here rather than a reason to skip it.
  nameservers: []
  # Long enough that the periodic trigger does not fire a second probe in the
  # middle of a run; scenario 6 triggers explicitly.
  interval: 6h
  # Well below the 15m default so scenario 9 gets a deterministic mailbox
  # health write: the loop logs in to the shared probe mailbox and records the
  # result, which is exactly the state-only shadow row the scenario reads back
  # out of Postgres (ADR-0017).
  mailbox_check_interval: 15s
  # The collect loop ticks once a minute, so a probe that really arrives is
  # judged inside ~65s. Two minutes is "it is not coming", not "wait longer".
  timeout: 2m
  # Scenario 6b: the inbound webhook of ADR-0016. The harness plays the part
  # of whatever forwards mail to sendplane - it pulls the delivered probe mail
  # out of GreenMail, rewrites it as the {from,to,headers,text} body of
  # internal/probe/inbound/sendplanehook and posts it signed with this secret
  # (X-Sendplane-Signature, see test/e2e/scenario_probe_webhook.go).
  webhooks:
    - provider: sendplane
      secret: whsec_e2e-probe-webhook

# Scenario 9: the operator's shared sending infrastructure (ADR-0017).
#
# It is configuration and is never written to the database — the scenario
# proves that by reading the shadow rows back out of Postgres and finding every
# configuration column empty. The relay is the same chaos-smtp the bulk
# campaign uses, so a transactional send through the shared sender really goes
# out and the harness can read the rendered From header back off the wire.
platform:
  transports:
    - id: relay
      name: Shared e2e relay
      host: chaos-smtp
      port: 2525
      tls: none
      # No username/password: cmd/chaos-smtp answers AUTH with 5.5.1, so a
      # credential here would make every send through the shared relay fail
      # before DATA and the From assertion would have nothing to read. The
      # "no configuration in the database" assertion reads the shadow rows of
      # the shared *sender* and *probe mailbox* instead, which are written by
      # the platform probe and the mailbox-check loop.
      max_conns: 8
      rate_per_second: 50
      # One tenant's slice of the shared relay (architecture 8.2).
      per_tenant_rate_per_second: 10

  domains:
    - id: dom
      domain: platform.e2e.test
      return_path_domain: bounce.platform.e2e.test

  senders:
    - id: default
      name: Shared e2e sender
      transport_id: relay
      domain_id: dom
      # Liquid over the request's tenant_vars: one entry, one address per
      # tenant. A request with no `slug` is 422 tenant_vars_missing.
      from_name: "{{ tenant.name }}"
      from_email: "sender+{{ tenant.slug }}@platform.e2e.test"
      # Transactional only: a campaign with this sender is 403
      # sender_use_denied, which is the policy half of the scenario.
      uses: [transactional]
      probe_vars:
        slug: probe
        name: sendplane probe

  # A shared probe mailbox on the same GreenMail the tenant's own probe uses,
  # under its own address so the two runs never read each other's mail. The
  # platform probe runs once, in `_system` (architecture 11.2).
  #
  # The mailbox is on GreenMail while the shared transport is chaos-smtp, so
  # the probe mail is accepted and then never arrives: the run times out and
  # the verdict is red. That is deliberate — it is the cheapest way to get a
  # deterministic *state* write for the shared sender, which is one of the two
  # shadow rows scenario 9 reads back out of Postgres. Pointing the shared
  # relay at GreenMail instead would make the probe green and make the
  # scenario's From assertion (read off chaos-smtp) impossible.
  probe_mailboxes:
    - id: probe
      name: Shared e2e probe mailbox
      address: platform-probe@sendplane.test
      host: greenmail
      port: 3143
      tls: none
      username: platform-probe@sendplane.test
      password: e2e
      inbox_folder: INBOX

limits:
  max_recipients_per_campaign: 100000

log:
  level: info
  format: text

console:
  # Nothing in this stack serves the ops console.
  enabled: false
