# Example configuration for cmd/sendplane. Copy, edit, and point --config (or
# SENDPLANE_CONFIG) at it. Every ${VAR} below is expanded against the process
# environment before the YAML is parsed (os.ExpandEnv), which is how the Helm
# chart injects the DSN and the secrets key from a Kubernetes Secret without a
# separate templating pass — see deploy/helm/sendplane/templates/configmap.yaml
# and secret.yaml.
#
# Every field has a runtime default except store.driver/dsn, secrets.key and
# whatever auth.mode you pick requires; see cmd/sendplane/config.go for the
# exact defaults.

store:
  # "postgres" or "mongo".
  driver: postgres
  dsn: ${SENDPLANE_STORE_DSN}
  # Only used when driver is "mongo".
  mongo_db: sendplane

secrets:
  # 32 raw bytes, base64-encoded (AES-256-GCM). Generate one with:
  #   openssl rand -base64 32
  key: ${SENDPLANE_SECRETS_KEY}

auth:
  # "apikey", "jwt" or "none". "none" authenticates every request as a fixed
  # local-dev principal and logs a warning on startup — do not use it outside
  # local development.
  mode: apikey
  api_keys:
    - key_hash: ${SENDPLANE_API_KEY_HASH} # hex(sha256(the actual key)), never the key itself
      tenant: acme
      principal: acme-ci
      roles: [admin]
  jwt:
    issuer: https://auth.example.com/
    audience: sendplane
    jwks_url: https://auth.example.com/.well-known/jwks.json
    tenant_claim: tenant   # claim name that holds the tenant ID
    roles_claim: roles     # claim name that holds a []string or space-separated string
  # Per-request tenant selection (ADR-0017).
  #
  # By default a caller gets its own tenant and cannot name another, which is
  # what a multi-tenant API should be. Turning this on lets a caller holding
  # one of the named roles select a tenant with a header, which is how an
  # operator console switches between a tenant and the *system* tenant
  # (`_system`) — the only view that shows the shared `platform:` transports,
  # domains, mailboxes and their probe state.
  #
  #   GET /api/v1/senders            -> the caller's own tenant
  #   GET /api/v1/senders
  #     X-Sendplane-Tenant: _system  -> the operator's view, with state
  #
  # GET /api/v1/whoami reports `can_switch_tenant`, so a console renders the
  # switcher only where it works. An embedding application does not use this:
  # it implements its own host.TenantResolver and makes its own decision.
  #
  # Leave it off unless something needs it: a role that can switch can read
  # and write every tenant it names.
  tenant_header:
    enabled: false
    header: X-Sendplane-Tenant
    roles: [operator]

authz:
  # "allow_all" (default) or "roles".
  mode: roles
  roles:
    admin:  ["*"]
    editor: ["template.*", "campaign.read", "campaign.write"]
    sender: ["campaign.send", "message.send"]

events:
  webhook:
    url: https://app.example.com/hooks/sendplane
    secret: ${SENDPLANE_WEBHOOK_SECRET} # HMAC-SHA256 key for the X-Sendplane-Signature header
    timeout: 10s
    # SSRF guard: reject destinations that resolve to a loopback/private/
    # link-local address unless this is set. Leave it false in production.
    allow_private_networks: false

sender:
  # Defaults to the pod hostname; set explicitly if you need a stable ID
  # across restarts (it is a lease owner, see docs/architecture.md 8.1).
  worker_id: ""
  lanes:
    transactional: 8
    bulk: 32
    # The loopback probe sends through the normal sender path, so this lane
    # needs at least one worker or every probe delivery sits queued and every
    # run times out (docs/architecture.md 11.2).
    probe: 1
  claim_batch: 200
  lease_for: 5m
  ehlo_name: mail.example.com
  default_rate_per_second: 0 # 0 = unlimited, unless the transport configures its own rate

bounce:
  # Lease owner of the per-mailbox lock, so one replica polls one mailbox.
  # Defaults to "bounce-" + the sender worker_id (the pod hostname).
  worker_id: ""
  poll_interval: 1m
  refresh_interval: 5m   # how often the bounce-mailbox list is re-read
  use_idle: true         # wait in IMAP IDLE instead of sleeping, when supported

probe:
  # Loopback sending health check (docs/architecture.md 11, ADR-0012). The
  # mailboxes themselves are tenant rows: POST /api/v1/probe-mailboxes.
  # Setting hmac_key turns the probe on; `enabled` overrides that either way.
  enabled: false
  # 32 raw bytes, base64. Signs the X-Sendplane-Probe token so a mail somebody
  # else drops in the probe mailbox cannot produce a green verdict.
  #   openssl rand -base64 32
  hmac_key: ${SENDPLANE_PROBE_HMAC_KEY}
  # Queried directly for the DNS diagnostic layer: "what the world sees" must
  # not be answered by a local cache. Empty uses /etc/resolv.conf.
  nameservers: ["1.1.1.1", "8.8.8.8"]
  interval: 6h   # how stale a sender's health may get before it is re-probed
  timeout: 15m   # how long a probe mail may take to arrive
  # How often the mailbox-check leader loop logs in to every enabled probe and
  # bounce mailbox and records the result as that mailbox's health
  # (architecture 11.5). It is what notices a password rotated in the
  # provider's console between two six-hourly probes, and it runs whether or
  # not `enabled` above is set: bounce mailboxes need the same watch.
  mailbox_check_interval: 15m
  # Inbound webhooks (ADR-0016). A probe mail can come back two ways: over
  # IMAP, which sendplane polls, or over a webhook that whatever received the
  # mail posts to sendplane. This list is the second way, and it is **global**:
  # one endpoint serves every tenant, because an inbound endpoint is a URL
  # somebody else was configured to call and a URL cannot be per tenant. The
  # tenant is resolved from the signed X-Sendplane-Probe token on the message.
  #
  # The format sendplane ships is `sendplane` — a small JSON body anything that
  # can POST can produce (a mail-receiving service's webhook, a Cloudflare
  # Email Worker, a script on your MX), signed with X-Sendplane-Signature.
  # internal/probe/README.md has the body, a curl example and the recipe for
  # adding another provider's native format.
  #
  # To use one:
  #   1. arrange for the mail to be forwarded to
  #      https://<control>/probe/inbound/sendplane, preserving the
  #      Authentication-Results, Received and X-Sendplane-Probe headers;
  #   2. set the same secret here as there;
  #   3. create a probe mailbox with `kind: webhook` and that address
  #      (POST /api/v1/probe-mailboxes), plus the authserv-id the receiving
  #      MX writes into Authentication-Results.
  #
  # A provider name this build does not know is refused at startup with the
  # list of the ones it does know.
  webhooks: []
  # - provider: sendplane
  #   # One of secret/secrets is required; several are accepted and any one
  #   # matching is enough, which is how a secret is rotated without a window
  #   # where deliveries are refused. `secret` is sugar for a one-element list.
  #   secrets:
  #     - ${SENDPLANE_PROBE_WEBHOOK_SECRET}
  #   path: ""             # default /probe/inbound/sendplane
  #   tolerance: 300s      # how stale a signed timestamp may be (default 5m)

# The operator's shared sending infrastructure: the relay, domain, From
# identity and mailboxes it runs *for* its tenants (ADR-0017,
# docs/architecture.md 5.4). Omit the whole section for a single-tenant
# deployment; nothing is wrapped and nothing costs anything.
#
# Three properties are the point of it:
#
#   * It is configuration, never data. A read of a shared transport resolves
#     this section every time; only runtime state about it (circuit status,
#     probe verdict, mailbox reachability) is persisted, in the `_system`
#     tenant, as a row that carries no host, no username and no password.
#     Rotating the relay password is a deploy, not a migration, and a database
#     dump of one tenant can never contain another tenant's relay credentials.
#   * There is no tenant table either. A shared sender's From address is Liquid
#     over the tenant attributes each *request* carries (`tenant_vars`, shaped
#     by the host's TenantVars hook), so your own database stays the only place
#     a tenant's name and slug live.
#   * A tenant sees the shared *senders* and nothing else. The relay behind
#     them, the DKIM key, the probe verdict of the shared reputation: all
#     `_system` only.
#
# Every ID here is local (`shared-eu`); the API and the store see it as
# `sys:shared-eu`, and every write to one answers 403 platform_read_only.
# Startup validates the whole section — unique IDs, resolvable references,
# parseable templates — and refuses to start rather than failing deliveries
# later.
platform:
  transports: []
  # - id: shared-eu
  #   name: Shared EU relay
  #   host: smtp.eu.example.net
  #   port: 587
  #   tls: starttls          # none | starttls (default) | tls
  #   username: sendplane
  #   password: ${SENDPLANE_SHARED_RELAY_PASSWORD}
  #   max_conns: 8
  #   # The whole relay's cluster-wide capacity, split across sender replicas.
  #   rate_per_second: 200
  #   # One tenant's slice of it: the fair share of architecture 8.2, which is
  #   # what stops a single campaign consuming the relay.
  #   per_tenant_rate_per_second: 20
  #   domain_rate_per_second:
  #     gmail.com: 50

  domains: []
  # - id: shared
  #   domain: mail.example.com
  #   dkim_selector: sp1
  #   dkim_private_key: ${SENDPLANE_SHARED_DKIM_KEY}
  #   return_path_domain: bounce.example.com
  #   expected_spf: include:_spf.example.net
  #   outbound_ips: [203.0.113.7]

  senders: []
  # - id: default
  #   name: Shared sender
  #   transport_id: shared-eu
  #   domain_id: shared
  #   # Liquid over the request's tenant_vars. One entry, one address per
  #   # tenant; a request that does not supply `slug` is 422
  #   # tenant_vars_missing rather than a mail from `sender+@mail.example.com`.
  #   from_name: "{{ tenant.name }}"
  #   from_email: "sender+{{ tenant.slug }}@mail.example.com"
  #   reply_to: ""
  #   # What tenants may use it for: campaign | transactional | probe.
  #   # Omitted means [campaign, transactional]. A send of a kind that is not
  #   # listed is 403 sender_use_denied. A Hooks.SenderPolicy replaces this
  #   # rule entirely and can chain it (sendplane.DefaultSenderPolicy).
  #   uses: [transactional]
  #   # The tenant variables the loopback probe renders the templates with: it
  #   # runs once, in `_system`, so the From address needs values from
  #   # somewhere (architecture 11.2).
  #   probe_vars:
  #     slug: probe
  #     name: sendplane probe

  # Shared probe and bounce mailboxes. A shared bounce mailbox's mail may
  # belong to any tenant, so the tenant is found from the delivery ID in the
  # VERP return path (architecture 10) rather than from the mailbox.
  probe_mailboxes: []
  # - id: gmail
  #   name: Shared Gmail probe
  #   address: probe@example.com
  #   host: imap.gmail.com
  #   port: 993
  #   tls: tls
  #   username: probe@example.com
  #   password: ${SENDPLANE_SHARED_PROBE_PASSWORD}
  #   inbox_folder: INBOX
  #   spam_folder: '[Gmail]/Spam'
  #   authserv_id: mx.google.com

  bounce_mailboxes: []
  # - id: shared
  #   name: Shared bounce mailbox
  #   address: bounces@bounce.example.com
  #   protocol: imap
  #   host: imap.example.com
  #   port: 993
  #   tls: tls
  #   username: bounces@bounce.example.com
  #   password: ${SENDPLANE_SHARED_BOUNCE_PASSWORD}
  #   folder: INBOX
  #   after_process: delete

  # Fallbacks for the matching tenant settings: a tenant that has configured
  # neither still gets working opens, clicks and unsubscribe links off the
  # operator's own domain. A tenant that sets its own wins, and
  # GET /api/v1/settings reports which one is in force (`*_source`).
  tracking_domain: ""
  unsubscribe_url_template: ""

limits:
  max_recipients_per_campaign: 10000000
  max_vars_bytes: 8192
  max_body_bytes: 2097152
  max_recipient_line_bytes: 65536

log:
  level: info  # debug | info | warn | error
  format: json # json | text

console:
  # Embedded Vue ops console (cmd/sendplane/console, ADR-0010). Only mounted
  # when --roles includes control, since the console has nothing to talk to
  # otherwise. `make console-sync` builds it; see cmd/sendplane/README.md.
  enabled: true
  # Not "/": the control role's REST API owns /api/v1 and tracking owns /t/
  # under sp.Handler()'s "/" mount, so the console needs its own prefix.
  path: /console
