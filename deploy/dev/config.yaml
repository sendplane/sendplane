# Local development configuration for cmd/sendplane (`make dev`). Committed
# on purpose so `make dev` needs no setup step — see cmd/sendplane/README.md
# and config.example.yaml for the full schema this is a cut-down instance of.
#
# NOT FOR PRODUCTION. This file turns off authentication for every request
# and ships a secret key in git; both are fine on a laptop and dangerous
# anywhere else. See auth.mode and secrets.key below.

store:
  driver: postgres
  # config.go's LoadConfig runs os.ExpandEnv on this file before parsing, and
  # Go's os.Expand replaces an unset ${VAR} with the empty string (not the
  # literal text) - so "${SENDPLANE_STORE_DSN}" with the var unset would
  # unmarshal as store.dsn: "" and fail Validate. To keep `make dev` working
  # with zero environment setup, the DSN is hardcoded to match
  # deploy/dev/docker-compose.yml's postgres service (host port 55441,
  # user/password/db all "sendplane"). Point SENDPLANE_CONFIG at your own
  # file if you need a different DSN.
  dsn: postgres://sendplane:sendplane@localhost:55441/sendplane?sslmode=disable

secrets:
  # 32 raw bytes, base64 (AES-256-GCM), generated once with `openssl rand
  # -base64 32` and committed on purpose: transport passwords and other
  # secrets encrypted with it need to survive a `make dev` restart, and
  # nothing this key protects ever leaves your machine. Production MUST
  # supply its own key (e.g. via SENDPLANE_SECRETS_KEY in config.example.yaml)
  # - never reuse this one outside local dev.
  key: CvFnN8Ifr0S7OCG7L2kgX2sB3APEHBQK+9JEHC2fuNU=

# auth.mode: none authenticates EVERY request as a fixed local principal (no
# API key, no bearer token, nothing checked) and authz.mode: allow_all grants
# it every action. This combination must never be used outside local
# development - it is the entire point of `make dev` being one command, and
# the reason this file must never be reused as a starting point for a real
# deployment.
auth:
  mode: none

  # Per-request tenant selection (ADR-0017). With auth.mode: none there is one
  # fixed local principal, so the role list is not what gates it here; the
  # switch is on so that the console can flip between `default` and the system
  # tenant `_system`, which is the only view that shows the shared platform
  # transports, domains, mailboxes and their probe state.
  #
  #   curl -H 'X-Sendplane-Tenant: _system' localhost:8080/api/v1/senders
  #
  # In a real deployment this is off unless an operator console needs it, and
  # then only for the roles named here: a caller holding one can read and
  # write any tenant it names.
  tenant_header:
    enabled: true
    header: X-Sendplane-Tenant
    roles: [admin]

authz:
  mode: allow_all

# The operator's shared sending infrastructure (ADR-0017). It is configuration
# and is never written to the database: a read resolves this section, and only
# runtime state about it (circuit status, probe verdict, mailbox health) is
# persisted, in the `_system` tenant, as a row that carries no configuration
# column at all.
#
# `make dev` points it at the same chaos-smtp sink `make dev-smtp` runs, so a
# transactional send through the shared sender actually completes and you can
# read what arrived from http://localhost:12590/messages?body=1.
#
# Try it (auth is off, so no credentials):
#
#   curl -sS localhost:8080/api/v1/senders | jq '.items[] | select(.shared)'
#   curl -sS -X POST localhost:8080/api/v1/messages \
#     -H 'Content-Type: application/json' -d '{
#       "sender_id": "sys:default",
#       "template_id": "<a published template>",
#       "tenant_vars": {"slug": "acme", "name": "Acme, Inc."},
#       "to": [{"email": "someone@example.com"}]
#     }'
#
# The From address comes out as `Acme, Inc. <sender+acme@dev.local>`: one
# configured sender, one address per tenant, no tenant table anywhere.
platform:
  transports:
    - id: shared
      name: Shared dev relay
      # cmd/chaos-smtp as `make dev-smtp` runs it: plaintext, no auth.
      host: 127.0.0.1
      port: 12525
      tls: none
      max_conns: 2
      rate_per_second: 20
      # One tenant's slice of the relay: the fair share of architecture 8.2.
      # Set low on purpose here, so a burst through the shared transport is
      # visibly paced in the logs.
      per_tenant_rate_per_second: 5

  domains:
    - id: dev
      domain: dev.local
      return_path_domain: dev.local

  senders:
    - id: default
      name: Shared dev sender
      transport_id: shared
      domain_id: dev
      # Liquid over the request's tenant_vars: one entry, one address per
      # tenant. A request whose tenant_vars carry no `slug` is a 422
      # (tenant_vars_missing) rather than a mail from `sender+@dev.local`.
      from_name: "{{ tenant.name }}"
      from_email: "sender+{{ tenant.slug }}@dev.local"
      # Transactional only: a tenant may send a password reset through the
      # shared identity but not a newsletter over a reputation everybody
      # shares. A campaign with this sender is 403 sender_use_denied.
      uses: [transactional]
      # What the loopback probe renders the templates with. The probe runs
      # once, in `_system`, so its From address needs values from somewhere.
      probe_vars:
        slug: probe
        name: sendplane probe

# No events.webhook section: dev has nothing listening for it, and it's
# optional (config.go only requires events.webhook.secret when
# events.webhook.url is set).

sender:
  lanes:
    transactional: 4
    bulk: 8
    probe: 1
  ehlo_name: localhost

probe:
  enabled: true
  # 32 raw bytes, base64, committed on purpose for the same reason
  # secrets.key above is: `make dev` must work with no setup step, and this
  # key only signs the X-Sendplane-Probe token of mail your own machine sends
  # to your own mailbox. Production MUST supply its own
  # (SENDPLANE_PROBE_HMAC_KEY in config.example.yaml). Without it
  # `probe.enabled: true` fails validation, because a probe nothing can
  # verify is worse than none.
  hmac_key: 9Qe1sYpVqz3dK7mCw0oXhR2tNbGvLuAjE5FrZ8SdI4w=
  # mailbox_check_interval defaults to 15m (architecture 11.5). Drop it to
  # something like 30s here when you want to watch a mailbox you broke on
  # purpose flip to unhealthy.
  #
  # The inbound webhook of ADR-0016, so `make dev` can receive a test delivery
  # with no setup: POST /probe/inbound/sendplane, signed with this secret.
  # Committed on purpose for the same reason the keys above are, and for the
  # same reason never reusable outside local dev - it is the only thing
  # standing between a caller and a forged probe verdict.
  #
  #   BODY='{"from":"a@example.com","to":["probe@example.com"],"headers":{}}'
  #   T=$(date +%s)
  #   SIG=$(printf '%s.%s' "$T" "$BODY" \
  #     | openssl dgst -sha256 -hmac whsec_dev-probe-webhook -hex \
  #     | sed 's/^.* //')
  #   curl -sS -X POST localhost:8080/probe/inbound/sendplane \
  #     -H "Content-Type: application/json" \
  #     -H "X-Sendplane-Signature: t=$T,v1=$SIG" --data-binary "$BODY"
  #
  # See internal/probe/README.md for the full body and what a real forwarder
  # has to preserve.
  webhooks:
    - provider: sendplane
      secret: whsec_dev-probe-webhook

log:
  level: debug
  format: text

console:
  enabled: true
  path: /console
