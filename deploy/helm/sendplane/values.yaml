# Default values for the sendplane chart. See deploy/helm/sendplane/README.md
# for a short overview (Korean) and cmd/sendplane/config.example.yaml for the
# full config.yaml schema that .Values.config mirrors.

image:
  repository: sendplane
  # Defaults to .Chart.appVersion when unset.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- control: API + leader loops (scheduler, finalizer, canceller, reaper,
# retention, outbox). Runs >=2 replicas behind a PDB so the leader lease
# always has a standby (docs/architecture.md 14). -----------------------
control:
  roles: control
  replicas: 2
  listen: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    port: 80
  pdb:
    enabled: true
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # API host: the REST console/API (sp.Handler()).
    apiHost: ""
    # trackingDomain host: open pixel / click / unsubscribe links embedded in
    # sent mail (architecture 9). Routed to the same control Service as the
    # API, since both are served by the same Handler().
    trackingHost: ""
    tls: []
    # - secretName: sendplane-tls
    #   hosts: [api.example.com, track.example.com]

# --- sender: claim/render/SMTP loop. Scales on load, transactional lane is
# always served first (architecture 8.1). --------------------------------
sender:
  roles: sender
  replicas: 2
  listen: 8080
  resources:
    requests: { cpu: 200m, memory: 128Mi }
    limits: { memory: 512Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    # HorizontalPodAutoscaler on CPU. See templates/hpa-sender.yaml for a
    # commented-out KEDA ScaledObject alternative that scales on a Prometheus
    # queue-depth query instead of CPU, which tracks send backlog more
    # directly than CPU does.
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# --- bounce: IMAP/POP3 bounce mailbox poller. Single replica: it owns no
# leader lease of its own (RunBounce is one loop, not a leader election). ---
bounce:
  enabled: true
  roles: bounce
  replicas: 1
  listen: 8080
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- migrate: runs `sendplane --migrate` as a Helm pre-install/pre-upgrade
# hook Job, so the schema is always current before any role starts. ---------
migrate:
  enabled: true
  backoffLimit: 3
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

serviceMonitor:
  # Requires the Prometheus Operator CRDs. sendplane's Metrics interface
  # (host.Metrics) needs a Prometheus-exporting adapter wired in by whoever
  # builds Options.Metrics; this only wires the Kubernetes scrape config.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}

# config.yaml, rendered verbatim into the ConfigMap
# (templates/configmap.yaml) and mounted at /etc/sendplane/config.yaml. Any
# ${VAR} value is expanded by the binary itself (os.ExpandEnv) against the
# container's environment, which is how secrets.storeDSN /
# secrets.secretsKey / secrets.webhookSecret below reach it without a second
# templating pass: the Secret sets the env var, the ConfigMap references it.
config:
  store:
    driver: postgres        # postgres | mongo
    dsn: ${SENDPLANE_STORE_DSN}
    mongo_db: sendplane     # only used when driver is mongo
  secrets:
    key: ${SENDPLANE_SECRETS_KEY}
  auth:
    mode: apikey             # apikey | jwt | none ("none" is for local dev only)
    api_keys: []
    # - key_hash: <hex sha256 of the key>
    #   tenant: acme
    #   principal: acme-ci
    #   roles: [admin]
    jwt:
      issuer: ""
      audience: ""
      jwks_url: ""
      tenant_claim: tenant
      roles_claim: roles
    # Per-request tenant selection (ADR-0017). Off by default; turn it on for
    # an operator console that has to reach the system tenant (`_system`),
    # which is the only view showing the shared `platform:` resources and
    # their state. A role that can switch can read and write every tenant it
    # names.
    tenant_header:
      enabled: false
      header: X-Sendplane-Tenant
      roles: [operator]
  authz:
    mode: allow_all          # allow_all | roles
    roles: {}
  events:
    webhook:
      url: ""
      secret: ${SENDPLANE_WEBHOOK_SECRET}
      timeout: 10s
      allow_private_networks: false
  sender:
    lanes:
      transactional: 8
      bulk: 32
      probe: 1
    claim_batch: 200
    lease_for: 5m
    ehlo_name: ""
    default_rate_per_second: 0
  # Loopback sending health check (docs/architecture.md 11). Off unless
  # hmac_key is set; see cmd/sendplane/config.example.yaml for every field.
  # probe:
  #   enabled: true
  #   hmac_key: ${SENDPLANE_PROBE_HMAC_KEY}
  #   # Inbound webhooks (ADR-0016): whatever receives the probe mail posts
  #   # it to https://<control>/probe/inbound/sendplane instead of sendplane
  #   # polling IMAP. Global, one endpoint for every tenant. Point an Ingress
  #   # path at it.
  #   webhooks:
  #     - provider: sendplane
  #       secrets:
  #         - ${SENDPLANE_PROBE_WEBHOOK_SECRET}
  # The operator's shared sending infrastructure (ADR-0017,
  # docs/architecture.md 5.4): the relay, domain, From identity and mailboxes
  # it runs for its tenants. It is configuration, never data — nothing here is
  # written to the database, so rotating the relay password is a chart upgrade
  # and not a migration, and the secrets go through ${VAR} like every other
  # one (secrets.platform* below).
  #
  # Omit the whole section for a single-tenant deployment.
  # cmd/sendplane/config.example.yaml documents every field.
  # platform:
  #   transports:
  #     - id: shared
  #       name: Shared relay
  #       host: smtp.example.net
  #       port: 587
  #       tls: starttls
  #       username: sendplane
  #       password: ${SENDPLANE_PLATFORM_RELAY_PASSWORD}
  #       rate_per_second: 200
  #       per_tenant_rate_per_second: 20
  #   domains:
  #     - id: shared
  #       domain: mail.example.com
  #       dkim_selector: sp1
  #       dkim_private_key: ${SENDPLANE_PLATFORM_DKIM_KEY}
  #       return_path_domain: bounce.example.com
  #   senders:
  #     - id: default
  #       name: Shared sender
  #       transport_id: shared
  #       domain_id: shared
  #       from_name: "{{ tenant.name }}"
  #       from_email: "sender+{{ tenant.slug }}@mail.example.com"
  #       uses: [transactional]
  #   tracking_domain: t.example.com
  limits: {}
  log:
    level: info
    format: json

# Secret values. Either point existingSecret at a Secret you manage yourself
# (it must define the same keys: SENDPLANE_STORE_DSN, SENDPLANE_SECRETS_KEY,
# SENDPLANE_WEBHOOK_SECRET), or fill the plaintext fields below and let the
# chart create one (templates/secret.yaml) — fine for a values file kept out
# of version control (e.g. via --set-file or a sealed-secrets/external-secrets
# pipeline that renders this chart), not for one committed as-is.
secrets:
  existingSecret: ""
  storeDSN: ""
  secretsKey: ""
  webhookSecret: ""
  # Only rendered into the Secret when set, so a deployment that does not probe
  # carries no empty keys. Referenced from config above as
  # ${SENDPLANE_PROBE_HMAC_KEY} and ${SENDPLANE_PROBE_WEBHOOK_SECRET}
  # (ADR-0016).
  probeHMACKey: ""
  probeWebhookSecret: ""
  # The platform catalog's secrets (ADR-0017), referenced from config.platform
  # above as ${SENDPLANE_PLATFORM_RELAY_PASSWORD},
  # ${SENDPLANE_PLATFORM_DKIM_KEY}, ${SENDPLANE_PLATFORM_PROBE_PASSWORD} and
  # ${SENDPLANE_PLATFORM_BOUNCE_PASSWORD}. Only rendered into the Secret when
  # set, so a deployment with no shared resources carries no empty keys.
  platformRelayPassword: ""
  platformDKIMKey: ""
  platformProbePassword: ""
  platformBouncePassword: ""
