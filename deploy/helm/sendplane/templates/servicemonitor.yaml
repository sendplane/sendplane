{{/*
Requires the Prometheus Operator CRDs and metrics.enabled. Scrapes the
<fullname>-metrics Service (every role's pods) on the `metrics` port at
/metrics, served by the binary's --metrics-listen. podTargetLabels copies the
pod's component label onto each series so dashboards can tell roles apart.
*/}}
{{- if .Values.serviceMonitor.enabled }}
{{- if not .Values.metrics.enabled }}
{{- fail "serviceMonitor.enabled requires metrics.enabled=true (the ServiceMonitor scrapes the metrics Service)" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "sendplane.fullname" . }}
  labels:
    {{- include "sendplane.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "sendplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  podTargetLabels:
    - app.kubernetes.io/component
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
