apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sendplane.fullname" . }}-control
  labels:
    {{- include "sendplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: control
spec:
  replicas: {{ .Values.control.replicas }}
  selector:
    matchLabels:
      {{- include "sendplane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control
  template:
    metadata:
      labels:
        {{- include "sendplane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control
      {{- with .Values.control.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sendplane
          image: {{ include "sendplane.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/sendplane/config.yaml
            - --roles={{ .Values.control.roles }}
            - --listen=:{{ .Values.control.listen }}
          ports:
            - name: http
              containerPort: {{ .Values.control.listen }}
          envFrom:
            {{- include "sendplane.envFrom" . | nindent 12 }}
          volumeMounts:
            {{- include "sendplane.configVolumeMount" . | nindent 12 }}
          {{- include "sendplane.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
      volumes:
        {{- include "sendplane.configVolume" . | nindent 8 }}
      {{- with .Values.control.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.control.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.control.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
