version: "2"

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
    - gosec
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableChecksOnFunctions
            - disableChecksOnMethods
            - disableChecksOnTypes
            - disableChecksOnVariables
            - disableChecksOnConstants
    gosec:
      excludes:
        - G404
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
