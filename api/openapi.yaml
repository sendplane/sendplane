openapi: 3.1.0
info:
  title: sendplane API
  version: 0.1.0
  summary: Mail sending engine REST API.
  description: |
    sendplane is a library-first mail sending engine (see docs/architecture.md).
    The host application owns accounts, RBAC and the unsubscribe destination;
    sendplane owns templates, campaigns, deliveries, bounces and tracking.

    ## Mounting

    `Sendplane.Handler()` serves everything below `/api/v1` plus the public
    tracking routes below `/t`. The host mounts that handler on its own mux, so
    the origin in `servers` is the host's.

    ## Tenancy

    A tenant is never a path parameter. The host's `TenantResolver` derives it
    from the authenticated principal or the request, and the store layer is
    bound to it (ADR-0001, ADR-0006). Every object in this API therefore belongs
    to the caller's tenant implicitly.

    ## Authentication

    Authentication is host-provided. The reference binary ships an API-key and a
    JWT `Authenticator`, so the spec declares a generic `bearerAuth` and
    `apiKeyAuth` scheme; a host that plugs in its own `Authenticator` may accept
    something else entirely. Both schemes are optional at the document level and
    the public tracking routes clear `security` explicitly.

    ## Authorization

    Every operation declares the closed-set `Action` it requires through the
    `x-sendplane-action` extension (architecture 3). The host's `Authorizer`
    maps those strings onto its own RBAC. `none` marks a route that skips
    `Authorize` because it is public.

    | Action | Covers |
    | --- | --- |
    | `settings.read` / `settings.write` | tenant settings |
    | `sender.read` / `sender.write` | transports, senders, sending domains, probe mailboxes, probe runs |
    | `template.read` / `template.write` | layouts, templates, i18n bundles, previews, publishes, message versions |
    | `campaign.read` / `campaign.write` | campaign CRUD, recipient ingest, link report, unsubscribe notifications |
    | `campaign.send` | start, pause, resume, cancel, bulk retry |
    | `message.send` | transactional send |
    | `delivery.read` | deliveries, attempts, bounces |
    | `delivery.write` | single-delivery retry and unsubscribe notification |
    | `suppression.read` / `suppression.write` | suppression list |
    | `event.read` / `event.write` | event outbox listing and replay |
    | `none` | public tracking routes and the liveness probe |

    ## Pagination

    List endpoints are cursor paginated: `limit` (1-1000, default 50) and
    `cursor`, answering `{ "items": [...], "next_cursor": "..." }`.
    `next_cursor` is absent or empty on the last page.

    ## Optimistic concurrency

    Mutable objects carry a monotonically increasing `version`. A `PUT` must
    echo the version it read; a mismatch answers `409` with code
    `version_conflict`.

    ## Idempotency

    `POST /messages` and `POST /campaigns/{campaignId}/recipients` accept an
    `Idempotency-Key` header. Replaying a completed request returns the stored
    result instead of sending again (architecture 7.2).

    ## Secrets

    SMTP passwords, DKIM private keys, IMAP passwords and tracking signing
    secrets are `writeOnly`: they are encrypted at rest by the host's
    `SecretCipher` and never appear in a response. A `has_*` boolean reports
    whether one is set.

    ## Limits

    `Limits` caps recipients per campaign, body size and per-recipient `vars`
    size (architecture 16). A request over a transport-level size cap is
    rejected with `413`; a request that parses but breaks a configured limit is
    rejected with `422` and code `limit_exceeded`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: sendplane
    url: https://github.com/joseph/sendplane

servers:
  - url: '{origin}'
    description: |
      The host application's own origin. sendplane has no origin of its own: the
      host mounts `Sendplane.Handler()` on its mux. The public tracking routes
      below `/t` are additionally reachable through the tenant's
      `tracking_domain`, which must route to the same handler.
    variables:
      origin:
        default: https://app.your-host.tld
        description: Scheme and authority the sendplane handler is mounted under.

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - name: Tenant Settings
    description: Retry policy, retention, suppression, unsubscribe mode and tracking configuration.
  - name: Transports
    description: SMTP accounts, their rate limits and circuit state.
  - name: Senders
    description: From identities bound to a transport and a sending domain.
  - name: Sending Domains
    description: DKIM material, return-path domain and observed outbound IPs.
  - name: Bounce Mailboxes
    description: IMAP/POP3 accounts DSNs and feedback reports are polled from (architecture 10).
  - name: Probe Mailboxes
    description: IMAP accounts loopback probe mail is recovered from.
  - name: Probe Runs
    description: Loopback probe history and manual triggers (architecture 11).
  - name: Layouts
    description: Reusable wrappers with a content slot and their own i18n bundle.
  - name: Templates
    description: Editable message sources, their i18n bundles, previews and publishes.
  - name: Message Versions
    description: Immutable publish snapshots that sending actually uses.
  - name: Campaigns
    description: Bulk sends, recipient ingest and lifecycle control.
  - name: Deliveries
    description: One recipient of one message version, plus its attempt history.
  - name: Messages (transactional)
    description: One-off sends that bypass campaigns.
  - name: Suppressions
    description: Opt-in built-in do-not-send list (ADR-0008).
  - name: Bounces
    description: Parsed DSNs and feedback reports (architecture 10).
  - name: Events
    description: Event outbox listing, dead letters and replay (architecture 12).
  - name: Tracking (public)
    description: |
      Unauthenticated routes the tenant's `tracking_domain` points at
      (architecture 9.1). The token carries the delivery, the interaction kind
      and, for clicks, the destination, all under an HMAC, so no per-recipient
      link is stored and an open redirect is impossible. These routes are rate
      limited and never return anything but a pixel, a redirect or an empty 200.
  - name: Inbound (public)
    description: |
      Unauthenticated endpoints that whatever received a probe mail posts it
      to, so that a loopback probe can come back over a webhook instead of an
      IMAP account sendplane polls (ADR-0016). One endpoint serves every
      tenant: the tenant is resolved from the signed `X-Sendplane-Probe` token
      on the message, never from the request. The routes are rate limited per
      client address and verify the request signature before they parse
      anything.
  - name: Health
    description: Liveness, transport circuit state and sender loopback verdicts.

paths:
  /healthz:
    get:
      operationId: getServiceHealth
      summary: Liveness and readiness probe
      tags: [Health]
      security: []
      x-sendplane-action: none
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceHealth' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/settings:
    get:
      operationId: getTenantSettings
      summary: Read tenant settings
      description: Settings are created with defaults on first access; this never returns 404.
      tags: [Tenant Settings]
      x-sendplane-action: settings.read
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateTenantSettings
      summary: Replace tenant settings
      tags: [Tenant Settings]
      x-sendplane-action: settings.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantSettingsUpdate' }
      responses:
        '200':
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transports:
    get:
      operationId: listTransports
      summary: List transports
      tags: [Transports]
      x-sendplane-action: sender.read
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of transports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createTransport
      summary: Create a transport
      tags: [Transports]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transports/{transportId}:
    parameters:
      - { $ref: '#/components/parameters/TransportId' }
    get:
      operationId: getTransport
      summary: Read a transport
      tags: [Transports]
      x-sendplane-action: sender.read
      responses:
        '200':
          description: The transport.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateTransport
      summary: Replace a transport
      description: Omitting `password` keeps the stored one.
      tags: [Transports]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransportUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteTransport
      summary: Delete a transport
      tags: [Transports]
      x-sendplane-action: sender.write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/transports/{transportId}/health:
    parameters:
      - { $ref: '#/components/parameters/TransportId' }
    get:
      operationId: getTransportHealth
      summary: Read transport circuit state
      description: |
        Repeated auth, TLS or connection failures mark a transport `unhealthy`
        and stop routing to it until an EHLO+AUTH probe recovers it
        (architecture 8.3).
      tags: [Health]
      x-sendplane-action: sender.read
      responses:
        '200':
          description: Current circuit state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransportHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/senders:
    get:
      operationId: listSenders
      summary: List senders
      tags: [Senders]
      x-sendplane-action: sender.read
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of senders.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSender
      summary: Create a sender
      tags: [Senders]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SenderInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sender' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/senders/{senderId}:
    parameters:
      - { $ref: '#/components/parameters/SenderId' }
    get:
      operationId: getSender
      summary: Read a sender
      tags: [Senders]
      x-sendplane-action: sender.read
      responses:
        '200':
          description: The sender.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sender' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateSender
      summary: Replace a sender
      tags: [Senders]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SenderUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sender' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteSender
      summary: Delete a sender
      tags: [Senders]
      x-sendplane-action: sender.write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/senders/{senderId}/health:
    parameters:
      - { $ref: '#/components/parameters/SenderId' }
    get:
      operationId: getSenderHealth
      summary: Read sender loopback health
      description: |
        The summary verdict is the worst of the latest probe run per mailbox
        (architecture 11.4).
      tags: [Health]
      x-sendplane-action: sender.read
      responses:
        '200':
          description: Latest verdict per probe mailbox.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SenderHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/senders/{senderId}/probe:
    parameters:
      - { $ref: '#/components/parameters/SenderId' }
    post:
      operationId: triggerProbeRun
      summary: Trigger a loopback probe now
      description: |
        Enqueues a `lane=probe` delivery per enabled probe mailbox and returns
        the run IDs to poll. This replaces a "test SMTP connection" button: the
        probe uses the real transport, DKIM signing and return path
        (architecture 11.2).
      tags: [Probe Runs]
      x-sendplane-action: sender.write
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbeTriggerRequest' }
      responses:
        '202':
          description: Probe deliveries enqueued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProbeTriggerResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sending-domains:
    get:
      operationId: listSendingDomains
      summary: List sending domains
      tags: [Sending Domains]
      x-sendplane-action: sender.read
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of sending domains.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendingDomainList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSendingDomain
      summary: Create a sending domain
      tags: [Sending Domains]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendingDomainInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendingDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sending-domains/{domainId}:
    parameters:
      - { $ref: '#/components/parameters/DomainId' }
    get:
      operationId: getSendingDomain
      summary: Read a sending domain
      tags: [Sending Domains]
      x-sendplane-action: sender.read
      responses:
        '200':
          description: The sending domain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendingDomain' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: updateSendingDomain
      summary: Replace a sending domain
      description: Omitting `dkim_private_key` keeps the stored one.
      tags: [Sending Domains]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendingDomainUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendingDomain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteSendingDomain
      summary: Delete a sending domain
      tags: [Sending Domains]
      x-sendplane-action: sender.write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/bounce-mailboxes:
    get:
      operationId: listBounceMailboxes
      summary: List bounce mailboxes
      tags: [Bounce Mailboxes]
      x-sendplane-action: sender.read
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: One page of bounce mailboxes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BounceMailboxList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createBounceMailbox
      summary: Create a bounce mailbox
      tags: [Bounce Mailboxes]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BounceMailboxInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BounceMailbox' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/bounce-mailboxes/test:
    post:
      operationId: testBounceMailboxCredentials
      summary: Test bounce mailbox credentials without saving them
      description: |
        Connects with the credentials in the body exactly as the poller would -
        dial, TLS, login, select the folder, log out - and reports how far it
        got. Nothing is persisted, so it is what a "Test" button next to a
        mailbox form calls before the mailbox exists.

        A mailbox that refuses the login is a `200` with `ok: false` and
        `stage: auth`, not a `4xx`: the request succeeded, the mailbox is what
        failed.
      tags: [Bounce Mailboxes]
      x-sendplane-action: sender.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BounceMailboxInput' }
      responses:
        '200':
          description: The check result, whether or not it succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailboxTestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/bounce-mailboxes/{mailboxId}/test:
    parameters:
      - { $ref: '#/components/parameters/BounceMailboxId' }
    post:
      operationId: testBounceMailbox
      summary: Test a stored bounce mailbox
      description: |
        Checks the stored credentials and records the outcome as the mailbox's
        `health`, so a manual test updates the badge the monitoring loop writes.

        Send `password` to try a new one before saving it. Such a test is not
        recorded as health and never saves the password: it answers "would this
