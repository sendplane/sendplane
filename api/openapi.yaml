    get:
      operationId: getTemplateI18n
      summary: Export a template i18n bundle
      description: |
        Content negotiation picks the representation; `format` overrides the
        `Accept` header. An empty map for a locale tag means "fall back to the
        language".
      tags: [Templates]
      x-sendplane-action: template.read
      parameters:
        - name: format
          in: query
          required: false
          description: Overrides content negotiation.
          schema:
            type: string
            enum: [json, yaml]
            default: json
      responses:
        '200':
          description: The bundle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/I18nBundle' }
            application/x-yaml:
              schema:
                type: string
                description: The same bundle serialized as a YAML document.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: replaceTemplateI18n
      summary: Import a template i18n bundle
      description: |
        Replaces the whole bundle. Keys the template does not use are reported
        as warnings; keys it uses but the bundle lacks are reported as
        `missing_keys` and block a later publish.
      tags: [Templates]
      x-sendplane-action: template.write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/I18nBundle' }
          application/x-yaml:
            schema:
              type: string
              description: The same bundle serialized as a YAML document.
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/I18nImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

